<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Download — Run the Ball</title>
  <script>
    var TESTFLIGHT_PUBLIC_LINK = 'https://testflight.apple.com/join/PLACEHOLDER';
    window.location.replace(TESTFLIGHT_PUBLIC_LINK);
  </script>
</head>
<body style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#0f1117;color:#e0e0e0;display:flex;align-items:center;justify-content:center;min-height:100vh;margin:0;text-align:center;padding:2rem;">
  <div>
    <p style="font-size:1rem;color:#a0a0a0;margin-bottom:1.25rem;">Redirecting to TestFlight&hellip;</p>
    <p style="font-size:0.9rem;">
      Not redirected?
      <a id="tf-link" href="https://testflight.apple.com/join/PLACEHOLDER"
         style="color:#f97316;text-decoration:none;font-weight:600;">
        Open TestFlight
      </a>
    </p>
    <script>
      var link = document.getElementById('tf-link');
      if (link) link.href = TESTFLIGHT_PUBLIC_LINK;
    </script>
  </div>
</body>
</html>
